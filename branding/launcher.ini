; SupportLauncher configuration
; Place a copy of this file (and optionally logo.png / app.ico) next to
; SupportLauncher-Setup.exe - the setup installs it instead of these defaults.
; DownloadUrl and CompanyName can also be set on the command line:
;   SupportLauncher-Setup.exe /VERYSILENT /URL="https://..." /COMPANY="..."

[Launcher]
CompanyName=Ihre Firma AG
WindowTitle=Fernwartung
; Name of the desktop / start menu shortcut (used by the setup)
ShortcutName=Fernwartung
StatusText=Das Support-Modul wird geladen …
SupportContact=Bei Problemen: +41 00 000 00 00

; Download link of your customized QuickSupport module (Management Console),
; e.g. https://get.teamviewer.com/xxxxxx - the launcher follows the page to the EXE
DownloadUrl=https://get.teamviewer.com/IHRE-ID

; Local file name of the downloaded module
FileName=QuickSupport.exe

; The downloaded file is only started if its Authenticode signer (CN or O)
; matches one of these names exactly (comma separated).
AllowedPublishers=TeamViewer Germany GmbH

TimeoutSeconds=60

; The launcher stays open until a window of one of these processes appears
; (or StartWaitSeconds have passed), then closes itself.
StartingText=TeamViewer wird gestartet, bitte einen Moment Geduld …
WindowProcessNames=TeamViewer
StartWaitSeconds=120

; Administrator rights - Windows asks "Möchten Sie zulassen, dass ..." only once:
;
; RequestAdmin=1    The prompt appears when the LAUNCHER starts. TeamViewer is then
;                   started with full rights and does not ask again. (recommended)
;                   If the customer clicks "Nein", the launcher continues normally.
; RequestAdmin=0    No prompt from the launcher; TeamViewer asks itself.
RequestAdmin=1

; RunWithoutAdmin=1 Start TeamViewer with normal rights, no prompt at all.
;                   Downside: the supporter cannot operate admin windows
;                   (e.g. installers) until the customer confirms them on site.
;                   Only used when the launcher itself runs without admin rights.
RunWithoutAdmin=0

; 1 = If TeamViewer is installed on the PC (service / tray icon), it blocks
;     QuickSupport. The launcher stops it for the session (needs admin rights,
;     Windows asks once) and starts the service again when QuickSupport is closed.
; 0 = leave an installed TeamViewer alone
StopInstalledTeamViewer=1
