; DEMO configuration for SupportLauncher
; Put this file (plus logo.png and app.ico) next to SupportLauncher-Setup.exe
; and run the setup. It works out of the box with the generic TeamViewer
; QuickSupport download; replace DownloadUrl with your own customized module.

[Launcher]
CompanyName=Demo AG
WindowTitle=Fernwartung Demo AG
; Shortcut name on the desktop / start menu (no umlauts)
ShortcutName=Fernwartung Demo AG
StatusText=Das Support-Modul wird geladen …
SupportContact=Demo-Hotline: +41 00 000 00 00

; Generic TeamViewer QuickSupport (always the current version).
; For your own logo/text in QuickSupport use the link of your customized module
; from the TeamViewer Management Console, e.g. https://get.teamviewer.com/xxxxxx
DownloadUrl=https://download.teamviewer.com/download/TeamViewerQS.exe
FileName=TeamViewerQS.exe

; Start only files signed by one of these publishers (CN or O, exact match)
AllowedPublishers=TeamViewer Germany GmbH,TeamViewer GmbH

TimeoutSeconds=60
